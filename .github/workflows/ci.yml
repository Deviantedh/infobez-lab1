name: CI/CD Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: 1. Build & Security Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Integration Tests
        run: mvn clean test --batch-mode

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

  sast:
    name: 2. SAST (SpotBugs & FindSecBugs)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Application
        run: mvn compile test-compile --batch-mode

      - name: Run SpotBugs SAST Analysis
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs --batch-mode

      - name: Upload SpotBugs SAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-sast-report
          path: target/spotbugsXml.xml

  sca:
    name: 3. SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9 --batch-mode
        continue-on-error: true

      - name: Upload OWASP Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
